#este es el ci 
#aqui ya agrege un nuevo token bien configurado
name: CI - tests + build + push

on:
  push:
    branches:
      - reyes
  pull_request:
    branches:
      - reyes

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/pabloreyes093/examen_dev_ops:reyes-3.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=$PWD pytest -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}
